name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: swarm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Enumeration proof and tests (Node ${{ matrix.node }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # The paytable fixture must be byte-identical to a fresh enumeration.
      # This fails the build if any published number drifts from the model.
      - name: Verify the frozen paytable fixture
        run: npm run paytable:check

      # Re-derives every published number and compares docs/MATH.md, README.md
      # and docs/DESIGN.md against the enumeration.
      - name: Tests
        run: npm test

      # Independent sanity cross-check of the written rules. Seeded, so a
      # failure here is reproducible rather than flaky.
      - name: Monte Carlo cross-check
        run: npm run simulate

      - name: Full enumeration report
        run: npm run enumerate | tee enumeration-report.txt

      - uses: actions/upload-artifact@v4
        if: always() && matrix.node == 22
        with:
          name: enumeration-report
          path: enumeration-report.txt
