name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: swarm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Enumeration proof and tests (Node ${{ matrix.node }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # The paytable fixture must be byte-identical to a fresh enumeration.
      # This fails the build if any published number drifts from the model.
      - name: Verify the frozen paytable fixture
        run: npm run paytable:check

      # Every generated table in every document must already be current. This
      # fails on a hand-edited number rather than silently rewriting it.
      - name: Verify the generated documentation tables
        run: npm run docs:check

      # The round service is TypeScript, and a type error in a money path is a
      # bug the test suite might not reach.
      - name: Typecheck
        run: npm run typecheck

      # Re-derives every published number, compares README.md, docs/MATH.md,
      # docs/DESIGN.md and docs/ENGINE.md against the enumeration, and plays
      # whole rounds through the HTTP API asserting the exact credit at every
      # step — including handing each settlement to the published reference
      # verifier in tools/simulate.mjs.
      - name: Tests
        run: npm test

      # The one thing the suite cannot prove by itself: that `npm run dev`
      # actually serves the game. Node's native type stripping needs 22.18+, so
      # this runs on the newest version in the matrix only.
      - name: Server and client boot
        if: matrix.node == 24
        run: |
          npm start &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/api/config > /tmp/config.json && break
            sleep 1
          done
          node -e "
            const config = require('/tmp/config.json');
            if (config.identity.adapterFingerprint !== '3fc7b96ea3546f14169032d070aa48f103de7db048cc8a306cf99227d33d36cf')
              throw new Error('the served adapter is not the frozen one');
            // Provenance: SWARM's module contract and the engine's own identities
            // are two different things and the running surface must serve both.
            // A single 'moduleApi' field beside the engine's version reads as a
            // conformance claim to a module that cannot express this game.
            if (config.identity.moduleApi !== undefined)
              throw new Error('the served identity collapsed both module identities into one field');
            if (config.identity.adapterContract.id !== 'reveal-engine/staged-survival-v1')
              throw new Error('the adapter contract is not the one docs/ENGINE.md declares');
            if (config.identity.engine.moduleApiVersion !== 'reveal-engine/module-v1')
              throw new Error('the engine module API is not the engine\`s own');
            if (config.identity.engine.shippedModule.id !== 'staged-survival')
              throw new Error('the shipped engine module is not named');
            // docs/DESIGN.md §9.7 and §9.9 are product surfaces, so the served
            // configuration has to carry them.
            if (config.pacing.roundCycleMs !== 2500 || config.pacing.enforcedBy !== 'server and client')
              throw new Error('the speed-of-play floors are not served as server-enforced');
            if (config.protection.realityCheckMinutes !== 30 || config.protection.helpResources.length < 3)
              throw new Error('the player-protection configuration is missing');
            console.log('served', config.identity.adapterId, config.identity.adapterVersion, 'on engine', config.identity.engine.version);
            console.log('contract', config.identity.adapterContract.id, '(implemented by', config.identity.adapterContract.implementedBy + ')');
          "
          curl -fsS http://127.0.0.1:8787/ | grep -q 'SWARM'
          kill %1

      # The adapter fingerprint, both commitment phases and the fixture digest
      # are the values the whole verification story hangs on. Printing them per
      # Node version is what turns this matrix into cross-version determinism
      # evidence.
      - name: Determinism receipts
        run: |
          node -e "import('./tools/simulate.mjs').then(m => console.log('fingerprint', m.adapterFingerprint()))"
          node -e "
            import('./tools/lib/canonical.mjs').then(async c => {
              const { buildPaytable } = await import('./tools/lib/report.mjs');
              console.log('fixture', c.digest(c.canonicalJson(buildPaytable())));
            })"

      # The round-3 and round-4 blockers, asserted rather than printed: a
      # settlement re-published under a different decision log must not verify;
      # a transcript that commits one stage twice must not verify; and a round
      # abandoned before it advanced must settle, verify, and be distinguishable
      # from a player-settled one. If any of this passes silently, the
      # commitment scheme has stopped working.
      - name: Forged, duplicated and relabelled transcripts are rejected
        run: |
          node -e "
            import('./tools/simulate.mjs').then(async m => {
              const { POLICIES } = await import('./tools/lib/model.mjs');
              const args = {
                seedHex: 'dc33ba04fda908c673650e88419ab5378c52c21333103f7a90717be45909f981',
                roundId: 'swarm-vector-side', clientEntropy: 'c'.repeat(64),
                stakeUnits: 1000000n, sideBetStakes: { SWARM: 100000n },
              };
              const honest = m.settleTicket({ ...args, policy: POLICIES.HALF_EVERY.fn });
              const other  = m.settleTicket({ ...args, policy: POLICIES.RUN.fn });
              console.log('seed commitment ', honest.proof.seedCommitment);
              console.log('body commitment ', honest.proof.bodyCommitment);
              const ok = m.verifyRound(m.proofBundle(honest));
              const forged = m.verifyRound({ ...m.proofBundle(other), actionLog: honest.proof.actionLog });
              console.log('honest ->', ok.code, '| forged ->', forged.code);
              // Guard against a vacuous pass: if the two policies made the same
              // decisions on this grid, swapping the logs proves nothing.
              if (JSON.stringify(honest.proof.actionLog) === JSON.stringify(other.proof.actionLog))
                throw new Error('the two logs are identical, so the forgery check is vacuous');
              if (!ok.ok) throw new Error('an honest settlement failed to verify');
              if (forged.ok) throw new Error('a forged action log verified');
              if (honest.proof.seedCommitment !== other.proof.seedCommitment)
                throw new Error('phase 1 should be identical across settlements of one round');
              if (honest.proof.bodyCommitment === other.proof.bodyCommitment)
                throw new Error('phase 2 failed to distinguish two decision logs');

              // A stage may be committed once. Round 3 accepted a second harvest
              // at the command surface and refused the transcript it produced.
              const first = honest.proof.actionLog.find(entry => entry.kind === 'HARVEST');
              const twice = m.verifyRound({
                ...m.proofBundle(honest),
                actionLog: [{ ...first, units: 1, kind: 'HARVEST' }, ...honest.proof.actionLog],
              });
              console.log('stage committed twice ->', twice.code, '|', twice.detail);
              if (twice.ok) throw new Error('a transcript committing one stage twice verified');

              // Abandonment at stage 0, the state round 3 left undefined.
              const abandoned = m.reconcileTicket({ ...args, abandonedAtStage: 0 });
              const settled = m.verifyRound(m.proofBundle(abandoned));
              const relabelled = m.verifyRound({ ...m.proofBundle(abandoned), settlementMode: 'PLAYER' });
              console.log('abandoned at stage 0 ->', abandoned.proof.terminal, settled.code, '| relabelled ->', relabelled.code);
              if (!settled.ok) throw new Error('a reconciled round failed to verify');
              if (relabelled.ok) throw new Error('a settlement mode was relabelled and still verified');
            }).catch(error => { console.error(error.message); process.exit(1); })"

      # Independent sanity cross-check of the written rules. Seeded, so a
      # failure here is reproducible rather than flaky.
      - name: Monte Carlo cross-check
        run: npm run simulate

      - name: Full enumeration report
        run: npm run enumerate | tee enumeration-report.txt

      - uses: actions/upload-artifact@v4
        if: always() && matrix.node == 22
        with:
          name: enumeration-report
          path: enumeration-report.txt
